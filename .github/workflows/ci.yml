name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Diagnose verification
        run: |
          bun run format
          git diff -- .
          bun run typecheck
          bun run test
          bun run build
          git diff --quiet -- .
